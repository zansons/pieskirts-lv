# pieskirts.lv on Netlify (free): force HTTPS, apex canonical
[[redirects]]
  from = "https://www.pieskirts.lv/*"
  to = "https://pieskirts.lv/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.pieskirts.lv/*"
  to = "https://pieskirts.lv/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://pieskirts.lv/*"
  to = "https://pieskirts.lv/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
